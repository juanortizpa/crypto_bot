# Ciclo diario GRATIS de la estrategia de rotacion.
#
# La estrategia decide una vez al dia, tras el cierre diario de Binance
# (00:00 UTC), asi que no hace falta un servidor encendido. El estado y los
# datos del panel web (docs/panel) se guardan en la rama `paper-state`.
#
# - Simulacion: corre siempre. No usa claves ni envia ordenes.
# - Dinero real: Binance rechaza los servidores de GitHub (estan en EE.UU.),
#   asi que aqui solo se publica la DECISION en `orden.json`. Las ordenes las
#   envia `ejecutor/ejecutor.py` desde el celular del usuario, y solo si la
#   variable del repositorio ROT_MODE vale `live` (o `salir` para vender todo).
name: Rotacion (ciclo diario)

on:
  schedule:
    - cron: "10 0 * * *"    # 00:10 UTC  (19:10 hora Colombia)
    - cron: "10 6 * * *"    # reintento por si el primero se retraso o fallo
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rotation-paper
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BINANCE_PUBLIC_URL: https://data-api.binance.vision
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-rotation.txt

      - run: pip install -r requirements-rotation.txt

      - name: Restaurar estado
        run: bash scripts/estado_panel.sh restaurar

      - name: Simulacion y orden del dia (sin ordenes reales)
        env:
          ROT_MODE: paper
          AUTO_EXECUTE: "False"
          ROT_CAPITAL: ${{ vars.ROT_CAPITAL || '1000' }}
          ROT_MODO_REAL: ${{ vars.ROT_MODE || 'paper' }}
        run: |
          python bot_crypto.py rotation once | tee reports/ultimo_ciclo.txt
          python bot_crypto.py rotation dashboard

      - name: Resumen
        if: always()
        run: |
          { echo '```'; cat reports/ultimo_ciclo.txt 2>/dev/null; echo; cat reports/orden.json 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar estado en la rama paper-state
        if: always()
        run: bash scripts/estado_panel.sh guardar "ciclo"
