# Ciclo diario GRATIS de la estrategia de rotacion.
#
# La estrategia decide una vez al dia, tras el cierre diario de Binance
# (00:00 UTC), asi que no hace falta un servidor encendido. El estado y los
# datos del panel web (docs/panel) se guardan en la rama `paper-state`.
#
# - Simulacion: corre siempre. No usa claves ni envia ordenes.
# - Dinero real: SOLO si la variable ROT_MODE vale `live` y existen los
#   secretos BINANCE_API_KEY / BINANCE_API_SECRET. Apagado por defecto.
#   ROT_MODE=salir vende todo a USDT y detiene el bot real.
name: Rotacion (ciclo diario)

on:
  schedule:
    - cron: "10 0 * * *"    # 00:10 UTC  (19:10 hora Colombia)
    - cron: "10 6 * * *"    # reintento por si el primero se retraso o fallo
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rotation-paper
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BINANCE_PUBLIC_URL: https://data-api.binance.vision
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-rotation.txt

      - run: pip install -r requirements-rotation.txt

      - name: Restaurar estado
        run: bash scripts/estado_panel.sh restaurar

      - name: Simulacion (sin ordenes reales)
        env:
          ROT_MODE: paper
          AUTO_EXECUTE: "False"
          ROT_CAPITAL: ${{ vars.ROT_CAPITAL || '1000' }}
        run: |
          python bot_crypto.py rotation once | tee reports/ultimo_ciclo.txt
          python bot_crypto.py rotation dashboard

      - name: Dinero real (solo si ROT_MODE es live o salir)
        if: ${{ vars.ROT_MODE == 'live' || vars.ROT_MODE == 'salir' }}
        continue-on-error: true
        env:
          ROT_MODE: live
          BINANCE_MODE: live
          AUTO_EXECUTE: "True"
          ROT_LIQUIDAR: ${{ vars.ROT_MODE == 'salir' && 'si' || 'no' }}
          ROT_CAPITAL: ${{ vars.ROT_CAPITAL_REAL }}
          ROT_MOSTRAR_MONTOS: ${{ vars.ROT_MOSTRAR_MONTOS }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        run: |
          set -o pipefail
          if [ -z "$BINANCE_API_KEY" ] || [ -z "$BINANCE_API_SECRET" ] || [ -z "$ROT_CAPITAL" ]; then
            echo "Modo real pedido pero faltan secretos o ROT_CAPITAL_REAL: no se opera." | tee reports/ultimo_ciclo_live.txt
            exit 1
          fi
          python bot_crypto.py rotation once --execute | tee reports/ultimo_ciclo_live.txt
          python bot_crypto.py rotation dashboard

      - name: Comprobar acceso a Binance para operar (solo lectura)
        if: always()
        continue-on-error: true
        env:
          BINANCE_MODE: live
          ROT_MODE: live
          ROT_CAPITAL: ${{ vars.ROT_CAPITAL_REAL || '0' }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        run: python bot_crypto.py rotation conexion

      - name: Resumen
        if: always()
        run: |
          for f in reports/ultimo_ciclo.txt reports/ultimo_ciclo_live.txt; do
            [ -f "$f" ] || continue
            { echo "### $f"; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Guardar estado en la rama paper-state
        if: always()
        run: bash scripts/estado_panel.sh guardar "ciclo"
