# Prueba de conexion con Binance desde GitHub (paso 4 del panel).
# SOLO LEE la cuenta: no envia ninguna orden. Publica en `paper-state`
# unicamente indicadores si/no (nunca saldos ni claves).
name: Probar conexion con Binance

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rotation-paper
  cancel-in-progress: false

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      BINANCE_MODE: live
      ROT_MODE: live
      ROT_CAPITAL: ${{ vars.ROT_CAPITAL_REAL || '0' }}
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-rotation.txt
      - run: pip install -r requirements-rotation.txt
      - name: Restaurar estado
        run: bash scripts/estado_panel.sh restaurar
      - name: Probar (solo lectura)
        run: |
          python bot_crypto.py rotation conexion | tee salida.txt
          { echo '```'; cat salida.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar resultado
        if: always()
        run: bash scripts/estado_panel.sh guardar "conexion"
